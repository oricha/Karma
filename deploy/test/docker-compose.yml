name: karma-test

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/oricha/karma-backend:develop}
    container_name: karma-backend-test
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      KARMA_FRONTEND_ORIGIN: ${KARMA_FRONTEND_ORIGIN}
      KARMA_JWT_SECRET: ${KARMA_JWT_SECRET}
      KARMA_SECURITY_REQUIRE_HTTPS: "true"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/oricha/karma-frontend:develop}
    container_name: karma-frontend-test
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
