<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>New Event in Group</title><style>body { font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; } .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; } .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #007bff; } .event-box { background: #f0f8ff; padding: 15px; border-left: 4px solid #007bff; margin: 20px 0; } .cta-button { display: inline-block; padding: 12px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; } .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }</style></head>
<body>
<div class="container">
    <div class="header"><h1>New Event in <span th:text="${groupName}">Group</span></h1></div>
    <div class="content">
        <p>Hello <span th:text="${user.name}">User</span>,</p>
        <p>A new event has been posted in your favorite group:</p>
        <div class="event-box">
            <h3 th:text="${event.title}">Event</h3>
            <p><strong>Date:</strong> <span th:text="${event.startTime}">Date</span></p>
            <p><strong>Location:</strong> <span th:text="${event.location}">Location</span></p>
            <p th:text="${event.description}">Description</p>
        </div>
        <a href="#" class="cta-button">View Event</a>
    </div>
    <div class="footer"><p>&copy; 2026 Karma Platform</p></div>
</div>
</body>
</html>
