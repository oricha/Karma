<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>RSVP Confirmado</title><style>body { font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; } .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; } .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #28a745; } .success-box { background: #d4edda; padding: 15px; border-left: 4px solid #28a745; margin: 20px 0; } .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }</style></head>
<body>
<div class="container">
    <div class="header"><h1>¡RSVP Confirmado!</h1></div>
    <div class="content">
        <p>Hola <span th:text="${user.name}">Usuario</span>,</p>
        <p>¡Gracias por confirmar tu asistencia!</p>
        <div class="success-box">
            <h3 th:text="${event.title}">Evento</h3>
            <p><strong>Fecha:</strong> <span th:text="${event.startTime}">Fecha</span></p>
            <p><strong>Ubicación:</strong> <span th:text="${event.location}">Ubicación</span></p>
        </div>
        <p>Estamos emocionados de verte en el evento. Si tienes preguntas, contacta al organizador.</p>
    </div>
    <div class="footer"><p>&copy; 2026 Karma Platform</p></div>
</div>
</body>
</html>
