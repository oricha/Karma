<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Restablecer Contraseña</title><style>body { font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; } .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; } .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #007bff; } .header h1 { color: #007bff; margin: 0; } .cta-button { display: inline-block; padding: 12px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; } .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }</style></head>
<body>
<div class="container">
    <div class="header"><h1>Restablecer Contraseña</h1></div>
    <div class="content">
        <p>Hola <span th:text="${user.name}">Usuario</span>,</p>
        <p>Recibimos una solicitud para restablecer tu contraseña. Haz clic en el enlace a continuación:</p>
        <a th:href="${resetLink}" class="cta-button">Restablecer Contraseña</a>
        <p>Este enlace expirará en 1 hora. Si no solicitaste esto, ignora este email.</p>
    </div>
    <div class="footer"><p>&copy; 2026 Karma Platform</p></div>
</div>
</body>
</html>
