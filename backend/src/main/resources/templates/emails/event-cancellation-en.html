<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Event Cancelled</title><style>body { font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; } .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; } .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #dc3545; } .alert-box { background: #f8d7da; padding: 15px; border-left: 4px solid #dc3545; margin: 20px 0; } .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }</style></head>
<body>
<div class="container">
    <div class="header"><h1>Event Cancelled</h1></div>
    <div class="content">
        <p>Hello <span th:text="${user.name}">User</span>,</p>
        <p>We regret to inform you that the following event has been cancelled:</p>
        <div class="alert-box">
            <h3 th:text="${event.title}">Event</h3>
            <p><strong>Date:</strong> <span th:text="${event.startTime}">Date</span></p>
            <p><strong>Location:</strong> <span th:text="${event.location}">Location</span></p>
        </div>
        <p>If you purchased a ticket, you will receive a refund within 5-7 business days.</p>
        <p>We hope to offer you another event soon.</p>
    </div>
    <div class="footer"><p>&copy; 2026 Karma Platform</p></div>
</div>
</body>
</html>
