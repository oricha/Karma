<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Tu Opinión Nos Importa</title><style>body { font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; } .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; } .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #007bff; } .event-box { background: #f0f8ff; padding: 15px; border-left: 4px solid #007bff; margin: 20px 0; } .cta-button { display: inline-block; padding: 12px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; } .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }</style></head>
<body>
<div class="container">
    <div class="header"><h1>Tu Opinión Nos Importa</h1></div>
    <div class="content">
        <p>Hola <span th:text="${user.name}">Usuario</span>,</p>
        <p>¡Gracias por asistir a nuestro evento! Nos gustaría conocer tu experiencia:</p>
        <div class="event-box">
            <h3 th:text="${event.title}">Evento</h3>
        </div>
        <p>Por favor, comparte tu opinión en la plataforma:</p>
        <a href="#" class="cta-button">Dejar Opinión</a>
        <p>Tu feedback nos ayuda a mejorar.</p>
    </div>
    <div class="footer"><p>&copy; 2026 Karma Platform</p></div>
</div>
</body>
</html>
