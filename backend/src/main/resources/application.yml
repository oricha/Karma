server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: karma-platform
  profiles:
    default: local
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true

karma:
  frontend-origin: ${KARMA_FRONTEND_ORIGIN:http://localhost:8080}
  jwt:
    issuer: ${KARMA_JWT_ISSUER:karma-platform}
    audience: ${KARMA_JWT_AUDIENCE:karma-platform-api}
    access-token-minutes: ${KARMA_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${KARMA_JWT_REFRESH_TOKEN_DAYS:7}
    secret: ${KARMA_JWT_SECRET}
  i18n:
    default-locale: ${KARMA_DEFAULT_LOCALE:es}
    locale-cookie-name: ${KARMA_LOCALE_COOKIE_NAME:karma_locale}
  storage:
    enabled: ${KARMA_STORAGE_ENABLED:false}
    bucket: ${KARMA_STORAGE_BUCKET:}
    region: ${KARMA_STORAGE_REGION:eu-west-1}
    endpoint: ${KARMA_STORAGE_ENDPOINT:}
    access-key: ${KARMA_STORAGE_ACCESS_KEY:}
    secret-key: ${KARMA_STORAGE_SECRET_KEY:}
    public-base-url: ${KARMA_STORAGE_PUBLIC_BASE_URL:}
    max-upload-size-bytes: ${KARMA_STORAGE_MAX_UPLOAD_SIZE_BYTES:10485760}
  geocoding:
    enabled: ${KARMA_GEOCODING_ENABLED:false}
    provider: ${KARMA_GEOCODING_PROVIDER:nominatim}
    base-url: ${KARMA_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${KARMA_GEOCODING_USER_AGENT:karma-platform/1.0}
    timeout-millis: ${KARMA_GEOCODING_TIMEOUT_MILLIS:3000}
    max-retries: ${KARMA_GEOCODING_MAX_RETRIES:2}
    cache-size: ${KARMA_GEOCODING_CACHE_SIZE:500}
  email:
    enabled: ${KARMA_EMAIL_ENABLED:false}
    from-email: ${KARMA_EMAIL_FROM:noreply@karma.local}
    from-name: ${KARMA_EMAIL_FROM_NAME:Karma}
  notification:
    unsubscribe-base-url: ${KARMA_UNSUBSCRIBE_BASE_URL:https://karma.local}
    hourly-limit: ${KARMA_NOTIFICATION_HOURLY_LIMIT:500}
  schedulers:
    digest-enabled: ${KARMA_SCHEDULER_DIGEST_ENABLED:true}
    reminder-enabled: ${KARMA_SCHEDULER_REMINDER_ENABLED:true}
    digest-cron: ${KARMA_SCHEDULER_DIGEST_CRON:0 0 9 * * MON}
    reminder-daily-cron: ${KARMA_SCHEDULER_REMINDER_DAILY_CRON:0 0 0 * * *}
    reminder-hourly-cron: ${KARMA_SCHEDULER_REMINDER_HOURLY_CRON:0 0 * * * *}
  security:
    require-https: ${KARMA_SECURITY_REQUIRE_HTTPS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${KARMA_EMAIL_FROM:noreply@karma.local}
  from-name: ${KARMA_EMAIL_FROM_NAME:Karma}
